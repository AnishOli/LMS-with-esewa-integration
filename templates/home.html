{% extends 'base.html' %}

{% block content %}
<div class="px-4 py-5 my-5 text-center">
    <i class="bi bi-mortarboard-fill text-primary" style="font-size: 4rem;"></i>
    <h1 class="display-5 fw-bold text-body-emphasis mt-3">Welcome to EduSpace</h1>
    <div class="col-lg-6 mx-auto">
        <p class="lead mb-4">Your premium destination for online education. Learn from industry experts and take your career to the next level.</p>
        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            {% if not user.is_authenticated %}
                <a href="{% url 'register' %}" class="btn btn-primary btn-lg px-4 gap-3 premium-shadow rounded-pill">Start Learning Today</a>
                <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-lg px-4 rounded-pill">Log In</a>
            {% else %}
                <a href="{% url 'courses:course_list' %}" class="btn btn-primary btn-lg px-4 gap-3 premium-shadow rounded-pill">Browse Courses</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
