{% extends 'base.html' %}

{% block title %}Delete Course - EduSpace{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 premium-shadow rounded-4 border-top border-danger border-4">
            <div class="card-body p-4 p-md-5 text-center">
                <div class="mb-4">
                    <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                </div>
                <h3 class="fw-bold mb-3">Delete Course?</h3>
                <p class="text-muted mb-4">Are you sure you want to delete the course <strong>"{{ course.title }}"</strong>? This action cannot be undone.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a href="{% url 'courses:instructor_dashboard' %}" class="btn btn-light px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
