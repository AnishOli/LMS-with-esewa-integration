{% extends 'base.html' %}

{% block title %}Password Reset Complete - EduSpace{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 premium-shadow rounded-4 text-center" style="background: #0d1f3a; border: 1px solid rgba(201,168,76,.15) !important;">
            <div class="card-body p-4 p-md-5">
                <div class="mb-4">
                    <i class="bi bi-check-circle-fill display-1 text-success"></i>
                </div>
                <h2 class="fw-bold text-white mb-3">Success!</h2>
                <p class="text-muted mb-4">Your password has been set. You may now log in with your new password.</p>
                <div class="mt-5">
                    <a href="{% url 'accounts:login' %}" class="btn btn-gold btn-lg rounded-3 w-100">Log In Now</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
