{% extends 'base.html' %}

{% block title %}Reset Password - EduSpace{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 premium-shadow rounded-4" style="background: #0d1f3a; border: 1px solid rgba(201,168,76,.15) !important;">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-white">Reset Password</h2>
                    <p class="text-muted">Enter your email address and we'll send you a link to reset your password.</p>
                </div>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold small">Email Address</label>
                        <input type="email" name="email" class="form-control" style="background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); color: #fff;" required>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-3">Send Reset Link</button>
                    </div>
                </form>
                <div class="text-center mt-4">
                    <a href="{% url 'accounts:login' %}" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
