{% extends 'base.html' %}

{% block title %}Account Settings - EduSpace{% endblock %}

{% block extra_css %}
<style>
    .profile-card {
        background: #0d1f3a;
        border: 1px solid rgba(201,168,76,.15);
        border-radius: 16px;
        box-shadow: 0 12px 36px rgba(0,0,0,.4);
    }
    .profile-header {
        border-bottom: 1px solid rgba(201,168,76,.1);
        padding: 2rem;
        text-align: center;
    }
    .profile-avatar-large {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, #c9a84c, #e8c56d);
        color: #07111f;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: 800;
        margin: 0 auto 1rem;
        box-shadow: 0 0 20px rgba(201,168,76,.3);
    }
    .form-label {
        color: #94a3b8;
        font-weight: 600;
        font-size: .85rem;
    }
    .form-control {
        background: rgba(255,255,255,.05);
        border: 1px solid rgba(255,255,255,.1);
        color: #f1f5f9;
        border-radius: 10px;
        padding: .75rem 1rem;
    }
    .form-control:focus {
        background: rgba(255,255,255,.08);
        border-color: #c9a84c;
        box-shadow: 0 0 0 4px rgba(201,168,76,.1);
        color: #fff;
    }
    .btn-gold {
        background: linear-gradient(135deg, #c9a84c, #e8c56d);
        border: none;
        color: #07111f;
        font-weight: 700;
        padding: .75rem 2rem;
        border-radius: 10px;
        transition: transform .2s, box-shadow .2s;
    }
    .btn-gold:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(201,168,76,.4);
        color: #07111f;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-lg-6">
        <div class="profile-card overflow-hidden">
            <div class="profile-header">
                <div class="profile-avatar-large">
                    {{ user.email|first|upper }}
                </div>
                <h3 class="fw-bold text-white mb-1">{{ user.email }}</h3>
                <span class="badge rounded-pill px-3 py-2" style="background: rgba(201,168,76,.1); color: #c9a84c; border: 1px solid rgba(201,168,76,.2);">
                    <i class="bi bi-patch-check-fill me-1"></i>{{ user.role|capfirst }}
                </span>
            </div>
            <div class="p-4 p-md-5">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label">First Name</label>
                            <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}" placeholder="First Name">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Last Name</label>
                            <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}" placeholder="Last Name">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" value="{{ user.email }}" disabled>
                        <div class="form-text text-muted">Email cannot be changed.</div>
                    </div>

                    <hr class="my-4 border-secondary opacity-25">
                    
                    <h5 class="text-white fw-bold mb-4">Change Password</h5>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label">New Password</label>
                            <input type="password" name="new_password" class="form-control" placeholder="Leave blank to keep current">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" name="new_password2" class="form-control" placeholder="Repeat new password">
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-5">
                        <button type="submit" class="btn btn-gold px-5">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
